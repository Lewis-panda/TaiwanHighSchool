<!doctype html>
<html lang="$if(lang)$$lang$$else$zh-Hant-TW$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="HighSchooContent publishing pipeline">
  <title>$if(title-prefix)$$title-prefix$ - $endif$$pagetitle$</title>
$for(css)$
  <link rel="stylesheet" href="$css$">
$endfor$
</head>
<body>
  <header class="document-hero">
    <div class="document-hero__eyebrow">$subject$ · $course$</div>
    <h1>$title$</h1>
$if(subtitle)$
    <p class="document-hero__subtitle">$subtitle$</p>
$endif$
    <div class="document-hero__meta">
$if(audience)$
      <span>版本：$audience$</span>
$endif$
$if(scope)$
      <span>範圍：$scope$</span>
$endif$
$if(updated)$
      <span>內容校訂：$updated$</span>
$endif$
    </div>
  </header>
  <main class="handout">
$body$
  </main>
</body>
</html>
